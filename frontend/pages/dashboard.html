<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FocusLensAI - Demo Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="bg-gray-50">
  <nav class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center">
        <i data-feather="eye" class="h-8 w-8 text-indigo-600"></i>
        <span class="ml-3 font-bold">FocusLensAI Demo</span>
      </div>
      <div>
        <button id="refreshBtn" class="px-3 py-2 bg-indigo-100 rounded">Refresh</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-6">
    <!-- Stats & charts simplified for brevity -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white p-6 rounded shadow">
        <h2 class="font-medium">Daily Activity Breakdown</h2>
        <canvas id="activityChart" class="mt-4" height="220"></canvas>
      </div>
      <div class="bg-white p-6 rounded shadow">
        <h2 class="font-medium">Application Usage</h2>
        <canvas id="appUsageChart" class="mt-4" height="220"></canvas>
      </div>
    </div>
  </main>

  <script src="/assets/js/dashboard.js"></script>
  <script>feather.replace()</script>
</body>
</html>
